[package]
name = "githubdesk"
version = "0.1.0"
description = "Cliente de Git y GitHub de escritorio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "githubdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
