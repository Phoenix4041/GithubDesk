[package]
name = "githubdesk"
version = "0.1.0"
description = "Cliente de Git y GitHub de escritorio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "githubdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs", "net"] }
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "form", "gzip", "http2", "system-proxy"] }
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
